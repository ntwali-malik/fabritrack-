spring.application.name=fabritrack

# Server port (set SERVER_PORT=8081 if 8080 is already in use)
server.port=${SERVER_PORT:8080}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/fabritrack
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (use env JWT_SECRET in production; key must be at least 256 bits for HS256)
jwt.secret=beb28667c84a48394daecd70b2347c69b32f1ae88b53f40c7c678d029a1011f9
jwt.expiration-ms=86400000

# Profile image uploads (relative to working directory or absolute path)
fabritrack.profile-images-dir=uploads

# Optional: scheduled notifications cron (default: daily at 8:00 AM)
# app.notifications.schedule.cron=0 0 8 * * ?

# Theft / anomaly detection (rule-based)
# Demo-friendly: low thresholds so movements trigger alerts easily during presentation
app.anomaly.allowed-hour-start=6
app.anomaly.allowed-hour-end=22
# Any asset with value >= 1 moved by IT/FINANCE triggers (use 10000 in production)
app.anomaly.high-value-threshold=1
# Same asset moved more than 2 times in 24h triggers (use 5 in production)
app.anomaly.max-movements-per-asset-24h=2
